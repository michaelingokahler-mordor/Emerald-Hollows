name: Verify game and web build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:levels
      - run: node tools/verify-backup.mjs
      - run: npm run build
      - run: npx wrangler deploy --dry-run --config server/wrangler.jsonc
