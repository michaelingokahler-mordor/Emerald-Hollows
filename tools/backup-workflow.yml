name: Encrypted daily backup
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: emerald-hollows-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Download and encrypt
        run: node backup.mjs create
        env:
          BACKUP_API_URL: ${{ vars.BACKUP_API_URL }}
          BACKUP_READ_TOKEN: ${{ secrets.BACKUP_READ_TOKEN }}
      - name: Commit encrypted archive
        run: |
          git config user.name 'Emerald Hollows backup'
          git config user.email 'actions@users.noreply.github.com'
          git add daily monthly
          if ! git diff --cached --quiet; then
            git commit -m 'Save encrypted daily backup'
            git push
          fi
